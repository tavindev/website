<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="380" fill="#fafafa" rx="12"/>

  <!-- Domain Logic box -->
  <text x="400" y="32" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">YOUR DOMAIN</text>

  <rect x="310" y="48" width="180" height="44" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="400" y="75" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="500">Service</text>

  <!-- Two interface branches from Service -->
  <line x1="355" y1="92" x2="220" y2="135" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="445" y1="92" x2="580" y2="135" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- EventPublisher interface -->
  <rect x="135" y="135" width="170" height="44" rx="10" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
  <text x="220" y="162" font-size="13" fill="#fff" text-anchor="middle" font-weight="500">EventPublisher</text>

  <!-- RepositorySource interface -->
  <rect x="495" y="135" width="170" height="44" rx="10" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
  <text x="580" y="162" font-size="13" fill="#fff" text-anchor="middle" font-weight="500">RepositorySource</text>

  <!-- EventPublisher adapters -->
  <line x1="185" y1="179" x2="120" y2="230" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="255" y1="179" x2="280" y2="230" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="55" y="230" width="130" height="40" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="120" y="255" font-size="12" fill="#64748b" text-anchor="middle">SNS</text>

  <rect x="215" y="230" width="130" height="40" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="280" y="255" font-size="12" fill="#64748b" text-anchor="middle">Redis</text>

  <!-- EventPublisher labels below boxes -->
  <text x="120" y="290" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">PROD</text>
  <text x="280" y="290" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">LOCAL</text>

  <!-- RepositorySource adapters -->
  <line x1="545" y1="179" x2="520" y2="230" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="615" y1="179" x2="680" y2="230" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="455" y="230" width="130" height="40" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="520" y="255" font-size="12" fill="#64748b" text-anchor="middle">GitHub API</text>

  <rect x="615" y="230" width="130" height="40" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="680" y="255" font-size="12" fill="#64748b" text-anchor="middle">Local Git</text>

  <!-- RepositorySource labels below boxes -->
  <text x="520" y="290" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">PROD</text>
  <text x="680" y="290" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">LOCAL</text>

  <!-- Bottom text -->
  <text x="400" y="340" font-size="13" fill="#94a3b8" text-anchor="middle" font-style="italic">Same domain logic. Different infrastructure. Swap in seconds.</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d5db"/>
    </marker>
  </defs>
</svg>
